[project]
name = "fictional-quotes-invoices-pdf-creator"
version = "0.1.0"
description = "Generates fictional sample quotes and invoices from joineries as PDFs"
requires-python = ">=3.14"
dependencies = ["reportlab"]

[project.optional-dependencies]
ai = ["openai", "python-dotenv"]

[dependency-groups]
dev = ["pytest", "pypdf"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pdf_creator"
